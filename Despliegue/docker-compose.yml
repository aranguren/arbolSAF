volumes:
   db-data:

services:
   db:
      image: kartoza/postgis:12.0
      volumes:
         - db-data:/var/lib/postgresql
      env_file:
         - docker-env/db.env
      healthcheck:
        test: "exit 0"
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s
      restart: on-failure

   web:
      build: ..
      command: bash -c "python manage.py runserver 0.0.0.0:8000"
      env_file:
         - docker-env/web.env
      volumes:
         - ..:/code
      ports:
         - "8000:8000"
      depends_on:
         db:
            condition: service_healthy

   nginx:
      image: nginx:latest
      volumes:
          - ./nginx/conf:/etc/nginx/conf.d
          - ./nginx/certbot/conf:/etc/letsencrypt
          - ./nginx/certbot/www:/var/www/certbot
      ports:
       - "80:80"
       - "443:443"

   certbot:
      image: certbot/certbot
      volumes:
          - ./nginx/certbot/conf:/etc/letsencrypt
          - ./nginx/certbot/www:/var/www/certbot

