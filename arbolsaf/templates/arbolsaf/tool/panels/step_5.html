<!-- Paso 5 — Registro y reporte -->
<div class="card multisteps-form__panel p-3 border-radius-xl bg-white" id="step-5" data-animation="FadeIn">
  <div style="width:70%; margin:auto">
    <div class="row text-center">
      <div class="col-10 mx-auto">
        <h4 class="font-weight-normal">Para imprimir el reporte con los resultados de la consulta por favor llena este formulario.</h4>
      </div>
    </div>
    <div class="multisteps-form__content">
      <div class="row text-start">

        <div class="col-12 col-md-6 ms-auto mt-3">
          <label>Nombre del productor</label>
          <input class="multisteps-form__input form-control" type="text" name="NOMBRE" placeholder="Ej. Juan" onchange="handleForm(this)" required/>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3">
          <label>Región</label>
          <select class="form-control" name="REGION" id="choices-region" onchange="regionSelected(this)">
            <option value="">-- Seleccione --</option>
            <option value="Loreto">Loreto</option>
            <option value="Amazonas">Amazonas</option>
            <option value="Cajamarca">Cajamarca</option>
            <option value="Ucayali">Ucayali</option>
            <option value="San Martín">San Martín</option>
            <option value="Huánuco">Huánuco</option>
            <option value="Madre de Dios">Madre de Dios</option>
          </select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Provincia</label>
          <select class="form-control" name="PROVINCIA" id="choices-province" onchange="provinciaSelected(this)"></select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Distrito</label>
          <select class="form-control" name="DISTRITO" id="choices-district" onchange="handleForm(this)"></select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Tipo de intervención</label>
          <select class="form-control" name="TIPO DE INTERVENCION" id="choices-intervention" onchange="handleForm(this)">
            <option value="">-- Seleccione --</option>
            <option value="Agroforestería con cacao">Agroforestería con cacao</option>
            <option value="Agroforestería con palma aceitera">Agroforestería con palma aceitera</option>
            <option value="Agroforestería con café">Agroforestería con café</option>
            <option value="Plantación forestal mixta">Plantación forestal mixta</option>
            <option value="Purmas mejoradas">Purmas mejoradas</option>
            <option value="Huertos caseros">Huertos caseros</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3">
          <label>Tamaño de la finca (ha)</label>
          <input class="multisteps-form__input form-control" name="TAMANO DE FINCA" type="number" onchange="handleForm(this)"/>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3">
          <label>Tamaño de la parcela (ha)</label>
          <input class="multisteps-form__input form-control" name="TAMANO DE PARCELA" type="number" onchange="handleForm(this)"/>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Tipo de usuario</label>
          <select class="form-control" name="TIPO DE USUARIO" id="choices-user" onchange="handleForm(this)">
            <option value="">-- Seleccione --</option>
            <option value="Técnico">Técnico</option>
            <option value="Agricultor">Agricultor</option>
            <option value="Investigador">Investigador</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Identidad de género</label>
          <select class="form-control" name="IDENTIDAD DE GENERO" id="choices-gender" onchange="handleForm(this)">
            <option value="">-- Seleccione --</option>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
            <option value="Prefiero no decirlo">Prefiero no decirlo</option>
          </select>
        </div>

        <div class="col-12 col-md-6 ms-auto mt-3 text-start">
          <label>Edad del usuario</label>
          <select class="form-control" name="EDAD DEL USUARIO" id="choices-age" onchange="handleForm(this)">
            <option value="">-- Seleccione --</option>
            <option value="18-30">18-30</option>
            <option value="31-40">31-40</option>
            <option value="41-50">41-50</option>
            <option value="51-60">51-60</option>
            <option value="Mayor a 60">Mayor a 60</option>
          </select>
        </div>

      </div>

      <div class="row">
        <div class="mt-4 col-12 d-flex justify-content-end">
          <button class="btn bg-gradient-dark mb-0" style="color: white !important" type="submit" title="Send" id="print-button">Imprimir</button>
        </div>
      </div>
    </div>
  </div>
</div>
