<!-- Panel: Portafolio de especies -->
<div class="card multisteps-form__panel p-3 border-radius-xl bg-white" id="panel-portafolio">
  <div class="card-body py-2">
    <h4 style="font-weight:700;color:#1b4332;">Portafolio de especies</h4>
    <ul>
      <li class="mb-0 text-start">Principales usos y servicios de los árboles y palmeras..</li>
      <li class="mb-0 text-start">Categoría de amenaza según las fuentes del MIDAGRI/IUCN/CITES.</li>
      <li class="mb-0 text-start">IVIM= Índice de valor de importancia multifuncional (rango 0 a 18).</li>
    </ul>
    <hr class="my-2">
    <div class="d-flex justify-content-between align-items-center my-3 flex-wrap gap-2">
      <p class="text-muted mb-0" id="portafolio-count" style="font-size:0.85rem;">Cargando...</p>
      <input type="text" id="portafolio-search"
             placeholder="Buscar por nombre común o científico..."
             style="max-width:420px; width:100%;">
    </div>
    <!-- Spinner -->
    <div id="portafolio-loading" class="text-center py-5">
      <div class="spinner-border text-success" role="status" style="width:2.5rem;height:2.5rem;"></div>
      <p class="mt-2 text-muted" style="font-size:0.88rem;">Cargando especies...</p>
    </div>
    <!-- Grid -->
    <div id="portafolio-grid" class="cat-grid"></div>
    <!-- No results -->
    <div id="portafolio-no-results" class="text-center py-5" style="display:none;">
      <i class="fas fa-search fa-2x text-muted d-block mb-2"></i>
      <p class="text-muted">No se encontraron especies para "<span id="portafolio-search-term"></span>"</p>
    </div>
  </div>
</div>
